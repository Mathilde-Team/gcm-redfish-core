[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcm-redfish-core"
version = "0.1.0"
description = "Client Redfish générique et outils d'inventaire firmware multi-constructeur (HPE/Dell/Lenovo), cœur indépendant de GTK pour le plugin Redfish de GNOME Connection Manager."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Mathilde-Team" }
]
keywords = ["redfish", "bmc", "ilo", "idrac", "xclarity", "firmware", "gcm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.31",
    "urllib3>=2.0",
    # Journalisation (SOCLE §8) : loguru pour tout le Python de l'équipe.
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage>=7.0",
]

[project.urls]
Homepage = "https://github.com/Mathilde-Team/gcm-redfish-core"
Issues = "https://github.com/Mathilde-Team/gcm-redfish-core/issues"

[tool.setuptools.packages.find]
include = ["gcm_redfish_core", "gcm_redfish_core.*"]

[tool.setuptools.package-data]
gcm_redfish_core = ["data/*.json", "data/*.xml", "data/hpe_components/*.json"]

# Couverture mesurée sur les scripts de tests/ (lancés tels quels par la CI),
# lignes et branches, seuil bloquant à 95 % (issue #4).
[tool.coverage.run]
branch = true
parallel = true
source = ["gcm_redfish_core"]
# Script du socle repris de modele-depot (scripts/check_branch_protection.py),
# importé par son test pytest via pythonpath ci-dessous : mesuré lui aussi.
source_pkgs = ["check_branch_protection"]

[tool.coverage.report]
fail_under = 95
show_missing = true

# Seul tests/test_check_branch_protection.py passe par pytest (script du socle
# repris tel quel de modele-depot) ; les autres tests sont des scripts.
[tool.pytest.ini_options]
pythonpath = ["scripts"]
addopts = "-ra"
